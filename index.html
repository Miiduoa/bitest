<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BI 規劃師｜刷題系統</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1 class="app-title">BI 規劃師參考題型｜刷題系統</h1>
        <p class="app-sub" id="loadMeta">載入題庫中…</p>
      </div>
      <div class="meta-pill">
        <span id="statsLine"></span><br /><span id="wrongLine"></span>
      </div>
    </header>

    <div class="layout" id="appLayout">
      <aside class="panel" id="sideSetup">
        <h2>出題設定</h2>

        <div class="field-group">
          <span class="lbl">題庫範圍</span>
          <select id="scopeSelect">
            <option value="all">全部已選章節</option>
            <option value="wrong">僅錯題本</option>
          </select>
        </div>

        <div class="field-group">
          <span class="lbl">練習模式</span>
          <select id="modeSelect">
            <option value="practice">立即對答案（練習）</option>
            <option value="exam">模擬考（先作答、題目清單檢視、最後交卷）</option>
          </select>
        </div>

        <label class="check-row">
          <input type="checkbox" id="roteMode" />
          <span>背題模式：先隱藏選項文字（可隨題「顯示選項」）</span>
        </label>

        <div class="field-group">
          <span class="lbl">順序</span>
          <select id="shuffleSelect">
            <option value="no">依題號</option>
            <option value="yes">隨機洗牌</option>
          </select>
        </div>

        <div class="field-group">
          <label class="lbl" for="limitInput">題數上限（留空＝不加限制）</label>
          <input class="input-num" id="limitInput" type="number" min="1" placeholder="例如 40" />
        </div>

        <div class="field-group">
          <span class="lbl">章節</span>
          <div class="btns-row" style="margin-bottom: 8px">
            <button type="button" class="btn btn-ghost" id="btnSelectAllCh">全選</button>
            <button type="button" class="btn btn-ghost" id="btnClearCh">全不選</button>
            <button type="button" class="btn btn-ghost" id="btnClearWrong">清空錯題本</button>
          </div>
          <div id="chapterList" class="chapter-list" aria-label="章節清單"></div>
        </div>

        <button type="button" class="btn btn-primary" id="btnStart" style="width: 100%">開始</button>

        <h2>章節正確率</h2>
        <p class="chart-caption">以下為您在瀏覽器累計作答之章節正確率；尚無資料之章節不顯示長條。</p>
        <div class="chart-wrap">
          <canvas id="chapterChart" aria-label="章節正確率長條圖"></canvas>
        </div>

        <h2>作答紀錄</h2>
        <p class="chart-caption">
          匯出為 JSON（含每一題作答事件、錯題本與統計）；可備份後再於他裝置「匯入」合併。
        </p>
        <div class="btns-row">
          <button type="button" class="btn btn-ghost" id="btnExport">匯出 JSON</button>
          <button type="button" class="btn btn-ghost" id="btnImportPick">匯入合併</button>
          <button type="button" class="btn btn-danger" id="btnResetAll">重置本機資料</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden />
        </div>

        <p class="footer-hint">
          本機開發可執行 <code>python3 scripts/serve.py</code>。部署至
          <a href="https://vercel.com" rel="noopener noreferrer">Vercel</a>
          時將專案根目錄設為本站即可。（左右鍵換題需在選項未被聚焦時）
        </p>
      </aside>

      <main class="panel-main">
        <div data-screen="setup" hidden>
          <p class="welcome-hint">完成左側設定後按「開始」。交卷摘要會顯示於此區。</p>
          <section id="examSummary" aria-live="polite"></section>
        </div>

        <div data-screen="exam">
          <h2 style="margin: 0 0 12px; font-size: 1rem; color: var(--muted)">模擬考｜作答清單</h2>
          <p class="meta-pill" id="examProgress"></p>
          <div id="examList" style="margin-top: 12px"></div>
          <div class="toolbar" style="margin-top: 20px">
            <button type="button" class="btn btn-primary" id="btnSubmitExam">交卷並計分</button>
            <button type="button" class="btn btn-ghost" id="btnHomeFromExam">回到首頁</button>
          </div>
        </div>

        <div data-screen="quiz">
          <div class="toolbar">
            <strong id="quizTitle">練習模式</strong>
            <span class="meta-pill" id="toolbarMeta"></span>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
          </div>

          <section id="quizArea" aria-live="polite"></section>

          <div class="btns-row" id="practiceNav">
            <button type="button" class="btn btn-ghost" id="btnPrev">上一題</button>
            <button type="button" class="btn btn-primary" id="btnNext">下一題</button>
            <button type="button" class="btn btn-ghost" id="btnHome">回首頁</button>
          </div>

          <div class="btns-row" id="examNav" hidden>
            <button type="button" class="btn btn-ghost" id="btnPrevExam">上一題</button>
            <button type="button" class="btn btn-primary" id="btnNextExam">下一題</button>
            <button type="button" class="btn btn-ghost" id="btnExamBoard">題目總覽</button>
            <button type="button" class="btn btn-primary" id="btnSubmitExamInline">交卷並計分</button>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
